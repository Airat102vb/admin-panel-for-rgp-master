services:
  db:
    image: postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rgp-master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - rgp-master-network

networks:
  rgp-master-network:
    driver: bridge